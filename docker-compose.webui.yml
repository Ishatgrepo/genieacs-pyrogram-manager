# JFC-style, web-only GenieACS behind Cloudflare Tunnel.
# One central ACS server; no Telegram bot, public IPv4, Mongo/CPE passwords.
# Create credentials and start with: bash deploy/webui/setup.sh
# Cloudflare application: acs.cat6.in -> http://gateway:8080
name: genieacs-webui

x-genieacs: &genieacs
  build:
    context: .
    dockerfile: deploy/vps/GenieACS.Dockerfile
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  networks: [database, application]
  environment: &genieacs-env
    GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
    GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET:?Run bash deploy/webui/setup.sh first}
    GENIEACS_FS_URL_PREFIX: https://acs.cat6.in/files/
    GENIEACS_LOG_FORMAT: json
    GENIEACS_ACCESS_LOG_FORMAT: json

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - webui-mongo:/data/db
    networks: [database]
    # No MongoDB auth like JFC: protected by internal-only Docker network.
    # No public Mongo port, and never publish one.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  cwmp:
    <<: *genieacs
    command: [genieacs-cwmp]
    environment:
      <<: *genieacs-env
      GENIEACS_CWMP_WORKER_PROCESSES: "2"
    # localhost-only for optional authenticated SSH/VPN site relay.
    ports: ["127.0.0.1:7547:7547"]

  nbi:
    <<: *genieacs
    command: [genieacs-nbi]
    environment:
      <<: *genieacs-env
      GENIEACS_NBI_WORKER_PROCESSES: "1"
    networks: [database]
    # NBI has no web login. NEVER expose it on a public port/hostname.
    ports: ["127.0.0.1:7557:7557"]

  fs:
    <<: *genieacs
    command: [genieacs-fs]
    environment:
      <<: *genieacs-env
      GENIEACS_FS_WORKER_PROCESSES: "1"

  ui:
    <<: *genieacs
    command: [genieacs-ui]
    environment:
      <<: *genieacs-env
      GENIEACS_UI_WORKER_PROCESSES: "1"

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [ui, cwmp, fs]
    volumes:
      - ./deploy/webui/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/ui.htpasswd:/etc/nginx/auth/ui.htpasswd:ro
    networks: [application, cloudflare]
    # Cloudflare is the only external path. No published host port.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: [.env.tunnel]
    depends_on: [gateway]
    networks: [cloudflare]

networks:
  database:
    internal: true
  application:
    internal: true
  cloudflare: {}

volumes:
  webui-mongo: {}
