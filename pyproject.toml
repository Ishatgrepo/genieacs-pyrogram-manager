[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genieacs-pyrogram-manager"
version = "0.1.0"
description = "Authorized GenieACS fleet management through Pyrogram and FastAPI"
requires-python = ">=3.12"
dependencies = [
  "kurigram>=2.2.26,<3", "TgCrypto>=1.2.5,<2", "pymongo>=4.13,<5",
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3", "reportlab>=4.3,<5", "matplotlib>=3.9,<4"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "mongomock-motor>=0.0.35", "ruff>=0.11", "PyYAML>=6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
