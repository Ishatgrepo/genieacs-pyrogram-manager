name: Validate manager
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -e '.[test]'
      - run: ruff check app tests
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
      - run: docker build -t genieacs-manager:test .
      - run: docker build -f deploy/vps/GenieACS.Dockerfile -t genieacs-engine:test .
      - name: Validate Compose with throwaway CI-only settings
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          text = Path('.env').read_text()
          for key in ('MONGO_ROOT_PASSWORD','MONGO_APP_PASSWORD','MONGO_ACS_PASSWORD','GENIEACS_UI_JWT_SECRET','API_TOKEN','BOT_API_TOKEN','CPE_USERNAME','CPE_PASSWORD'):
              text = text.replace(key+'=\n', key+'='+'c'*64+'\n')
          Path('.env').write_text(text)
          PY
          docker compose config --quiet
          cp deploy/cloudflare/tunnel.env.sample .env.tunnel
          docker compose -f docker-compose.cloudflare.yml config --quiet
          docker compose -f docker-compose.cloudflare.yml config --format json > /tmp/cloudflare-compose.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/cloudflare-compose.json').read_text())
          services = cfg['services']
          expected = {'mongo', 'cwmp', 'nbi', 'fs', 'ui', 'manager', 'gateway', 'cloudflared'}
          assert expected.issubset(services), sorted(services)
          for name in expected - {'ui'}:
              assert not services[name].get('ports'), f'{name} must not publish a host port'
          ui_ports = services['ui']['ports']
          assert len(ui_ports) == 1 and ui_ports[0]['host_ip'] == '127.0.0.1'
          assert services['cloudflared']['environment']['TUNNEL_TOKEN']
          PY
          docker run --rm \
            --add-host cwmp:127.0.0.1 \
            --add-host fs:127.0.0.1 \
            --add-host manager:127.0.0.1 \
            -v "$PWD/deploy/cloudflare/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:stable-alpine nginx -t
