name: Validate minimal GenieACS WebUI Cloudflare deployment
on:
  push:
    paths:
      - 'README.md'
      - 'docker-compose.webui.yml'
      - 'deploy/webui/**'
      - '.github/workflows/webui-cloudflare.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docker-compose.webui.yml'
      - 'deploy/webui/**'
      - '.github/workflows/webui-cloudflare.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer shell
        run: bash -n deploy/webui/setup.sh
      - name: Prepare CI-only (non-secret) configuration
        shell: bash
        run: |
          set -euo pipefail
          printf 'GENIEACS_UI_JWT_SECRET=%064d\n' 0 > .env
          cp deploy/webui/tunnel.env.example .env.tunnel
          mkdir -p secrets
          printf 'admin:example-not-valid-password-hash\n' > secrets/ui.htpasswd
      - name: Validate isolated Compose topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.webui.yml config --quiet
          docker compose -f docker-compose.webui.yml config --format json > /tmp/webui-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/webui-compose.json').read_text())
          services = cfg['services']
          expected = {'mongo', 'cwmp', 'nbi', 'fs', 'ui', 'gateway', 'cloudflared'}
          assert set(services) == expected, (set(services), expected)
          for name, item in services.items():
              for port in item.get('ports', []):
                  assert name in {'cwmp', 'nbi'}, f'{name} unexpectedly has a host port'
                  assert port.get('host_ip') == '127.0.0.1', f'{name} publishes a non-local port'
          assert set(services['mongo']['networks']) == {'database'}
          assert set(services['nbi']['networks']) == {'database'}
          assert 'cloudflare' in services['cloudflared']['networks']
          assert 'database' not in services['gateway']['networks']
          assert 'database' not in services['cloudflared']['networks']
          assert 'manager' not in services, 'No Telegram service allowed'
          assert 'MONGO_INITDB_ROOT_PASSWORD' not in services['mongo'].get('environment', {})
          PY
      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --add-host cwmp:127.0.0.1 \
            --add-host fs:127.0.0.1 \
            --add-host ui:127.0.0.1 \
            -v "$PWD/deploy/webui/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/secrets/ui.htpasswd:/etc/nginx/auth/ui.htpasswd:ro" \
            nginx:stable-alpine nginx -t
