# Cloudflare HTTPS -> http://gateway:8080 (internal Docker only).
# Native web UI at /; CWMP /cwmp/; firmware files /files/.
# JFC-style anonymous CPE enrollment: no cwmp.auth credentials are configured.
# This is NOT appropriate for an unrestricted production fleet.
events { worker_connections 1024; }
http {
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 32m;

        # Browser login protects only the UI; do not require it from CPEs.
        location = /cwmp {
            proxy_pass http://cwmp:7547/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 180s;
        }
        location ^~ /cwmp/ {
            proxy_pass http://cwmp:7547/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
        location ^~ /files/ {
            proxy_pass http://fs:7567/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # Built-in GenieACS Web UI, protected with the password configured
        # by setup.sh. NBI (:7557) is not routed here.
        location / {
            auth_basic "GenieACS Management";
            auth_basic_user_file /etc/nginx/auth/ui.htpasswd;
            proxy_pass http://ui:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
