# Public HTTPS ends at Cloudflare. Private HTTP is only within Docker.
# One hostname: / -> native GenieACS UI, /cwmp/ -> GenieACS CWMP,
# /files/ -> GenieACS file server. Never expose NBI.
events { worker_connections 1024; }

http {
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 32m;

        # CPE-facing, deliberately no HTTP Basic authentication.
        # CPE authentication is enforced by GenieACS cwmp.auth.
        location = /cwmp {
            proxy_pass http://cwmp:7547/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 180s;
        }
        location ^~ /cwmp/ {
            proxy_pass http://cwmp:7547/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Public firmware download endpoint for approved files.
        location ^~ /files/ {
            proxy_pass http://fs:7567/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # The native GenieACS UI/API. Not the raw GenieACS NBI.
        # Additional auth allows setting up the native GenieACS login safely.
        location / {
            auth_basic "GenieACS Management";
            auth_basic_user_file /etc/nginx/auth/ui.htpasswd;
            proxy_pass http://ui:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
