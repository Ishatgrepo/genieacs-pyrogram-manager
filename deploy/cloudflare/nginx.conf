# Cloudflare Tunnel publishes only http://gateway:8080 on api.cat6.in.
# The device-facing public ACS URL is https://api.cat6.in/cwmp/.
# The device-facing public file URL prefix is https://api.cat6.in/files/.
events {}

http {
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 32m;

        # Keep a trailing-slash location, strip /cwmp/ before GenieACS sees it.
        location = /cwmp { return 308 /cwmp/; }
        location ^~ /cwmp/ {
            proxy_pass http://cwmp:7547/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # GenieACS FS expects the file path at its own root.
        location ^~ /files/ {
            proxy_pass http://fs:7567/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # /api/* remains protected by the manager's bearer-token/RBAC checks.
        # Health endpoint and unprivileged root are also on this upstream.
        location / {
            proxy_pass http://manager:7860;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
